# NEAT v1 on Yoshi Island 2 (the first level). Edit and re-run `smwai train`.
name = "level1"

[env]
levels = ["YoshiIsland2"]
frame_skip = 4          # emulator frames per agent decision
radius = 6              # grid is (2r+1)^2 tiles around Mario
stuck_frames = 120      # no new furthest x for this long -> episode ends
max_frames = 20000

[reward]
progress = 1.0          # per pixel of new furthest x
clear_bonus = 1000.0
time_penalty = 0.0      # per frame
death_penalty = 0.0
powerup_bonus = 0.0
coin_bonus = 0.0

[train]
generations = 100
workers = 10            # parallel emulators (this machine has 12 cores)
checkpoint_every = 5
runs_dir = "runs"

[neat]
pop_size = 100
initial_connection = "partial_direct 0.05"   # share of input->output links at start
conn_add_prob = 0.5
conn_delete_prob = 0.2
node_add_prob = 0.2
node_delete_prob = 0.1
weight_mutate_rate = 0.8
weight_mutate_power = 0.5
compatibility_threshold = 3.0    # lower = more, smaller species
max_stagnation = 15              # generations before a species is dropped
survival_threshold = 0.2         # fraction of each species that breeds
elitism = 2
