# Can NEAT find the pipes once it can see them? `explore` inputs = physics + a pipe channel (pipes are green pipe tiles
# 0x134-0x13F, otherwise just solid blocks to the network); pipe_bonus 100000 for entering one (once per pipe).
# Yoshi Island 2: a down pipe at x ~3878 (bonus room). Yoshi Island 4: the way on is a sideways pipe at x ~2723.
# Compare with the pipe-yi2 / pipe-yi4 runs (no pipe channel). Count: scripts/count_events.py "exp-explore-pipes-*"
# Run: smwai experiment --spec configs/experiments/explore_pipes.toml
name = "explore-pipes"
base = "configs/yi3.toml"
seeds = [1, 2]
generations = 12
pop_size = 60
workers = 12

[[variant]]
name = "yi2-explore"
[variant.env]
levels = ["YoshiIsland2"]
inputs = "explore"
[variant.reward]
pipe_bonus = 100000.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "yi4-explore"
[variant.env]
levels = ["YoshiIsland4"]
inputs = "explore"
[variant.reward]
pipe_bonus = 100000.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
