# Was the Yoshi Island 1 clear a fluke? Repeat the long adaptive-mutation run (configs/yi1_adaptive.toml) on 3 new seeds.
# Seed 1 cleared at generation 23. Run: smwai experiment --spec configs/experiments/repeat_yi1_adaptive.toml
name = "repeat-yi1-adaptive"
base = "configs/yi1_adaptive.toml"
seeds = [2, 3, 4]
generations = 30
pop_size = 100
workers = 12

[[variant]]
name = "adaptive"
