# Seeds 4, 14, 24, 34: one population through Yoshi's Island 2 (easy), then 1, then 3, 40 genomes, 40 generations on EVERY level (no stop on a clear), nuke on.
# The idea: a population that has spent a full 40 generations on the easier levels is better established when it reaches the hardest one.
# Run: scripts/curriculum_213_40.sh   (log /tmp/curriculum_213_40.log)
name = "curriculum-213-40"
base = "configs/yi1_adaptive.toml"
seeds = [4, 14, 24, 34]
generations = 40            # per level, always all of them
stop_on_clear = false
pop_size = 40
workers = 12
levels = ["YoshiIsland2", "YoshiIsland1", "YoshiIsland3"]

[env]
inputs = "physics"

[neat]
num_hidden = 8
start_fraction = 0.025
conn_delete_prob = 0.5
compatibility_threshold = 4.5

[adapt]
nuke_after = 10
