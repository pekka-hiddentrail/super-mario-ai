# Will NEAT find the pipe? Yoshi Island 2 has a down pipe at x ~3878 (a bonus room) that a plain run to the goal passes.
# `pipe` pays 100000 for entering it (once) and 1 per pixel for climbing higher than ever before; both variants use collect
# inputs and adaptive mutation. Count the pipe events in each run's best run afterwards (scripts/count_events.py).
# Run: smwai experiment --spec configs/experiments/pipe_yi2.toml
name = "pipe-yi2"
base = "configs/yi2_collect.toml"
seeds = [1, 2, 3]
generations = 15
pop_size = 60
workers = 12

[[variant]]
name = "baseline"
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "pipe"
[variant.reward]
pipe_bonus = 100000.0
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
