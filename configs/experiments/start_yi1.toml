# An exact small start: 4 hidden nodes with 20 links, and 8 hidden nodes with 40 links (every hidden node has an input and a button link; the rest spread evenly).
# 15 generations, 25 genomes, seeds 1-3, Yoshi's Island 1. Controls from compare_yi1: hidden8 at the default 5% start (mean best x 2690) and the plain base (1934).
# Run: scripts/start_yi1.sh   (log /tmp/start_yi1.log)
name = "start-yi1"
base = "configs/yi1_adaptive.toml"
seeds = [1, 2, 3]
generations = 15
pop_size = 25
workers = 12

[[variant]]
name = "h4-l20"
[variant.neat]
num_hidden = 4
start_links = 20
compatibility_threshold = 4.5   # these small starts are 3.0-3.5 apart; at 3.0 every genome would be its own species

[[variant]]
name = "h8-l40"
[variant.neat]
num_hidden = 8
start_links = 40
compatibility_threshold = 4.5
