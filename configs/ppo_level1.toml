# PPO on Yoshi Island 2 (first level). Same environment and reward as the NEAT configs.
name = "ppo-level1"

[env]
levels = ["YoshiIsland2"]
inputs = "collect"      # solid, enemy, item, coin grids + water, Yoshi, power-up
frame_skip = 4
radius = 6
stuck_frames = 120
max_frames = 20000

[reward]
progress = 1.0
clear_bonus = 1000.0
time_penalty = 0.0
death_penalty = 0.0
powerup_bonus = 100.0
coin_bonus = 10.0

[train]
runs_dir = "runs"
seed = 1

[ppo]
total_steps = 500000
n_envs = 8              # parallel emulators
n_steps = 256           # steps per env per update (n_envs * n_steps samples per update)
batch_size = 512
n_epochs = 4
learning_rate = 0.0003
gamma = 0.99
ent_coef = 0.01         # exploration bonus; raise if it gets stuck repeating one action
clip_range = 0.2
reward_scale = 0.01     # rewards are multiplied by this for training (reported fitness is unscaled)
eval_every = 20480      # training steps between recorded evaluation episodes
net_arch = [256, 256]
