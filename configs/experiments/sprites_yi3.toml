# sprite_platforms on Yoshi's Island 3: the plain upview setup (the `base` variant of nodes_yi3 / nodes2_yi3) plus sprite_platforms, ten seeds, 20 generations, population 60.
# The checkerboard platforms (0x55, 0x57) are ground for the jump arcs and the platform grid instead of enemies; riding one is not 'stuck'.
# Baseline (same settings, same seeds 1-10): 3 of 10 seeds climbed (y < 100), median best x 548.
# About 5 minutes per run, 10 runs. Count climbs: scripts/seed_screen.py sprites-yi3. Run: scripts/sprites_yi3.sh (log /tmp/sprites_yi3.log)
name = "sprites-yi3"
base = "configs/yi3.toml"
seeds = [2, 4, 1, 3, 5, 6, 7, 8, 9, 10]
generations = 20
pop_size = 60
workers = 12

[[variant]]
name = "sprites"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
sprite_platforms = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
