# NEAT + PPO as one learner on Yoshi Island 1 (where plain NEAT plateaus near x 3500): every second generation PPO refines the
# two best genomes (weights and biases, same structure) and keeps the result when it plays better; NEAT then breeds from them.
# The comparison is the same NEAT run without the PPO step (an ablation, not two rival models).
# Run: smwai experiment --spec configs/experiments/hybrid_yi1.toml
name = "hybrid-yi1"
base = "configs/yi1.toml"
seeds = [3, 4, 5]
generations = 14
pop_size = 50
workers = 12

[[variant]]
name = "neat-only"
[variant.env]
inputs = "explore"
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "neat-ppo"
[variant.env]
inputs = "explore"
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
[variant.hybrid]
enabled = true
elites = 2
start_generation = 3
every = 2
n_envs = 8
steps = 128
iters = 3

[[variant]]
name = "neat-ppo-stall"       # PPO only while NEAT's best has not gained 20 for 2 generations
[variant.env]
inputs = "explore"
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
[variant.hybrid]
enabled = true
trigger = "stall"
stall_generations = 2
elites = 2
start_generation = 3
n_envs = 8
steps = 128
iters = 3
