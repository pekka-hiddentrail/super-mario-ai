[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smwai"
version = "0.1.0"
description = "Learning to play Super Mario World with NEAT and modern RL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "gymnasium", "neat-python", "pillow"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
emu = ["stable-retro"]   # Linux/WSL only (no Windows wheels)

[project.scripts]
smwai = "smwai.cli:main"

[tool.setuptools.package-data]
smwai = ["viewer/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
