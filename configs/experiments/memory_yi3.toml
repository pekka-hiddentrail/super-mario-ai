# Death-jump memory (takeoff_inputs, four-generation fade) and riding motion (ride_motion) against the plain upview setup on Yoshi's Island 3.
# Seeds 2 (dies jumping into the pit at x ~530) and 4 (climbs to the high route and reaches the platforms). 20 generations, population 60;
# about 4 minutes per run, 6 runs. Small samples: a direction, not proof. Takeoffs of every run: scripts/takeoff_summary.py <run folder>.
# Run: scripts/memory_yi3.sh   (log /tmp/memory_yi3.log)
name = "memory-yi3"
base = "configs/yi3.toml"
seeds = [2, 4]
generations = 20
pop_size = 60
workers = 12

[[variant]]
name = "base"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "takeoff"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
takeoff_inputs = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "ride"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
ride_motion = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
