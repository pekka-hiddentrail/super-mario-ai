# Long re-run of ledges-yi3 opp-up, seed 14: 50 genomes, 80 generations (the first run: 30 genomes, 40 generations).
name = "long-ledges-yi3-opp-up"
base = "configs/yi1_adaptive.toml"
seeds = [14]
generations = 80
pop_size = 50
workers = 12

[[variant]]
name = "opp-up"
[variant.env]
levels = ["states/manual_1793527866.state"]
inputs = "physics"
[variant.reward]
opportunity_bonus = 1.0
[variant.neat]
num_hidden = 8
start_fraction = 0.025
conn_delete_prob = 0.5
compatibility_threshold = 4.5
[variant.adapt]
nuke_after = 10
