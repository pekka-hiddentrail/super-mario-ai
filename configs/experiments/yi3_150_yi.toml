# Yoshi's Island 3 from its real start, the doubled opportunity bonus only: 4 seeds x 150 genomes x 150 generations, physics inputs, nuke on, last chance (wall only) on.
# Run: scripts/yi3_150.sh   (log /tmp/yi3_150.log)
name = "yi3-150"
base = "configs/yi1_adaptive.toml"
seeds = [4, 14, 24, 34]
generations = 150
pop_size = 150
workers = 12

[[variant]]
name = "double"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "physics"
last_chance_frames = 32
[variant.reward]
opportunity_bonus = 2.0
[variant.neat]
num_hidden = 8
start_fraction = 0.025
conn_delete_prob = 0.5
compatibility_threshold = 4.5
[variant.adapt]
nuke_after = 10
