# Seed 1 of curriculum-30 (it reached x 4600 of ~4826 in 40 generations) with a budget of 100 generations per level.
# One population through Yoshi's Island 1 and then 2: 30 genomes, 8 hidden nodes, 2.5% of all possible links at the start (286).
# Run: scripts/curriculum_100_yi.sh   (log /tmp/curriculum_100_yi.log)
name = "curriculum-100"
base = "configs/yi1_adaptive.toml"
seeds = [1]
generations = 100           # per level
pop_size = 30
workers = 12
levels = ["YoshiIsland1", "YoshiIsland2"]

[env]
inputs = "physics"

[neat]
num_hidden = 8
start_fraction = 0.025      # 2.5% of the 11,456 possible links = 286
conn_delete_prob = 0.5
compatibility_threshold = 4.5
