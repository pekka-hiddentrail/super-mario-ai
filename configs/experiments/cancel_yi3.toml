# Left+right and up+down cancel each other, plus the speed bonus (0.5, as in ladder_yi1), NEAT on Yoshi's Island 3.
# Baseline: the baseline variant of longer_yi3.toml (same seeds, 30 generations; best x 1154, 538, 1104).
# Run: smwai experiment --spec configs/experiments/cancel_yi3.toml
name = "cancel-yi3"
base = "configs/yi3.toml"
seeds = [4, 6, 7]
generations = 15
pop_size = 60
workers = 12

[[variant]]
name = "cancel-speed"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
cancel_opposites = true
[variant.reward]
height_bonus = 1.0
speed_bonus = 0.5
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
