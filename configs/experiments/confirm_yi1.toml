# Confirmation on fresh seeds: does a higher static mutation rate really help on Yoshi Island 1, and does the
# adaptive boost work now that tiny fitness gains no longer reset its stall counter?
# Run: smwai experiment --spec configs/experiments/confirm_yi1.toml
name = "confirm-yi1"
base = "configs/yi1.toml"
seeds = [3, 4, 5]
generations = 14
pop_size = 50
workers = 12

[[variant]]
name = "baseline"
[variant.env]
inputs = "collect"

[[variant]]
name = "mutate-more"
[variant.env]
inputs = "collect"
[variant.neat]
weight_mutate_power = 1.0
conn_add_prob = 0.7
node_add_prob = 0.3

[[variant]]
name = "adaptive-fixed"    # boost after 3 generations without a gain of 20+, restore on a real gain
[variant.env]
inputs = "collect"
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
