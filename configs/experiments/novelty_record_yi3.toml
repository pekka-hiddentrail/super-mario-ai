# Step 1 of the novelty plan: record behaviour novelty and map coverage only (weight 0), plain NEAT on Yoshi's Island 3.
# Run: smwai experiment --spec configs/experiments/novelty_record_yi3.toml
name = "novelty-record-yi3"
base = "configs/yi3.toml"
seeds = [4, 5]
generations = 20
pop_size = 60
workers = 12

[[variant]]
name = "record"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
[variant.novelty]
enabled = true
weight = 0.0
