# Tiny end-to-end run of NEAT + PPO on Yoshi Island 2 to check that the pieces fit (not a result).
name = "smoke-hybrid"
base = "configs/yi3.toml"
seeds = [1]
generations = 4
pop_size = 30
workers = 6

[[variant]]
name = "hybrid"
[variant.env]
levels = ["YoshiIsland2"]
inputs = "explore"
[variant.hybrid]
enabled = true
elites = 2
start_generation = 1
n_envs = 4
steps = 64
iters = 2
