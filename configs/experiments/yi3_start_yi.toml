# Yoshi's Island 3 from its real start, 3 seeds x 40 genomes x 40 generations, physics inputs, nuke on. The baseline (opportunity bonus 1.0, start_fraction 0.025,
# last_chance_frames = 32: in the last 32 frames of the stuck clock the env presses a fresh jump + RIGHT + run for the policy (so the baseline above had no such help).
# bias_init_stdev 1.0; same budget) reached x 541, 521, 788 on seeds 4, 14, 24. One change at a time: 'double' = opportunity bonus 2.0; 'sparse' = a sparser, quieter start
# (start_fraction 0.005, bias_init_stdev 0.1); 'both' = the two together. The best option is then run longer, and the sparse start against Yoshi's Island 1 and 2.
# Run: scripts/yi3_start.sh   (log /tmp/yi3_start.log)
name = "yi3-start"
base = "configs/yi1_adaptive.toml"
seeds = [4, 14, 24]
generations = 40
pop_size = 40
workers = 12

[[variant]]
name = "double"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "physics"
last_chance_frames = 32
[variant.reward]
opportunity_bonus = 2.0
[variant.neat]
num_hidden = 8
start_fraction = 0.025
conn_delete_prob = 0.5
compatibility_threshold = 4.5
[variant.adapt]
nuke_after = 10



[[variant]]
name = "sparse"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "physics"
last_chance_frames = 32
[variant.reward]
opportunity_bonus = 1.0
[variant.neat]
num_hidden = 8
start_fraction = 0.005
conn_delete_prob = 0.5
compatibility_threshold = 4.5
bias_init_stdev = 0.1
[variant.adapt]
nuke_after = 10


[[variant]]
name = "both"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "physics"
last_chance_frames = 32
[variant.reward]
opportunity_bonus = 2.0
[variant.neat]
num_hidden = 8
start_fraction = 0.005
conn_delete_prob = 0.5
compatibility_threshold = 4.5
bias_init_stdev = 0.1
[variant.adapt]
nuke_after = 10

