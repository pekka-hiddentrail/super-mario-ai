# Death nodes against the plain setup on Yoshi's Island 3: ten seeds (2 and 4 first, then 1, 3, 5-10), 20 generations, population 60. About 4 minutes
# per run, 20 runs, roughly 80 minutes. Count the seeds that climb (lowest y under 100): scripts/seed_screen.py nodes-yi3.
# Earlier 10-generation screens: base 2 of 10 climbed, takeoff inputs 2 of 10. Nodes: see docs/ROADMAP.md (death_nodes).
# Run: scripts/nodes_yi3.sh   (log /tmp/nodes_yi3.log)
name = "nodes-yi3"
base = "configs/yi3.toml"
seeds = [2, 4, 1, 3, 5, 6, 7, 8, 9, 10]
generations = 20
pop_size = 60
workers = 12

[[variant]]
name = "base"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "nodes"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
death_nodes = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
