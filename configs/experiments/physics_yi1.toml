# Do the jump inputs help? Same settings as the `symmetric` variant of window_yi1.toml (collect inputs, adaptive
# mutation, same seeds 3-7, population 50, 14 generations), plus Mario's speeds and, for jumps A/B held 1/10/25 frames,
# where each would land (jumpview.py). Compare with the `symmetric` runs of the window experiment.
# Run: smwai experiment --spec configs/experiments/physics_yi1.toml
name = "physics-yi1"
base = "configs/yi1.toml"
seeds = [3, 4, 5, 6, 7]
generations = 14
pop_size = 50
workers = 12

[[variant]]
name = "physics"
[variant.env]
inputs = "physics"
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
