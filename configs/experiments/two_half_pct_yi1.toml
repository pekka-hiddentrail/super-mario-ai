# One run on Yoshi's Island 1, same as screen_yi1 but a 2.5% start (about 286 links) instead of 0.24%: seed 1, 30 genomes, 80 generations.
# Run: scripts/two_half_pct_yi1.sh   (log /tmp/two_half_pct_yi1.log)
name = "two-half-pct-yi1"
base = "configs/yi1_adaptive.toml"
seeds = [1]
generations = 80
pop_size = 30
workers = 12

[[variant]]
name = "two-half-pct"
[variant.env]
inputs = "physics"
[variant.neat]
num_hidden = 8
start_fraction = 0.025
conn_delete_prob = 0.5
compatibility_threshold = 4.5
