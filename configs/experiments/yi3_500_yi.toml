# Yoshi's Island 3 from its real start, current base config, doubled opportunity bonus: the seeds that got past the early wall in yi3-seeds (11, 12) and the two earlier ones (24, 14),
# 40 genomes, 500 generations, nuke on; a run stops at its first clear. Seed-major: if the night runs out, the first seeds are done. Run: scripts/yi3_500.sh   (log /tmp/yi3_500.log)
name = "yi3-500"
base = "configs/yi1_adaptive.toml"
seeds = [11, 12, 24, 14]
generations = 500
pop_size = 40
workers = 12
stop_on_clear = true

[[variant]]
name = "double"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "physics"
last_chance_frames = 32
[variant.reward]
opportunity_bonus = 2.0
[variant.neat]
num_hidden = 8
start_fraction = 0.025
conn_delete_prob = 0.5
compatibility_threshold = 4.5
[variant.adapt]
nuke_after = 10
