# Does adaptive mutation help when NEAT plateaus? Yoshi Island 3 stalls near x ~550 within a few generations.
# Same settings as the baseline except [adapt]: after 3 generations without a new best, mutate harder until it improves.
# Run: smwai experiment --spec configs/experiments/adapt_yi3.toml
name = "adapt-yi3"
base = "configs/yi3.toml"
seeds = [1, 2, 3]
generations = 20
pop_size = 60
workers = 12

[[variant]]
name = "baseline"

[[variant]]
name = "adaptive"
[variant.adapt]
enabled = true
stall_generations = 3
power_factor = 2.0
structure_factor = 1.5
rate_add = 0.1
