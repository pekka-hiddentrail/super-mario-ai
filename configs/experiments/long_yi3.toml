# A few hours on Yoshi's Island 3: the setup that got Mario up to the high route (upview: 12 tiles of view upwards, climb bonus, fixed jump
# inputs, opposite buttons cancel, adaptive mutation) with and without the platform prediction (bridge), seed 4, 250 generations,
# population 80. Seed 4 reached x 1154 in 15 generations with this setup, so the idea is that more generations (and the extra mutation
# when it stalls) may carry it over the rest of the level. Order: upview, then predict (about 75 minutes each).
# Run: scripts/long_yi3.sh   (detached; log in /tmp/long_yi3.log)
name = "long-yi3"
base = "configs/yi3.toml"
seeds = [4]
generations = 250
pop_size = 80
workers = 12

[[variant]]
name = "upview"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "predict"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
predict_platforms = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
