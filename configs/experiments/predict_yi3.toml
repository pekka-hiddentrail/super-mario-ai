# upview_yi3.toml plus predict_platforms: the jump options use where the turn-block bridge will be during the jump (bridge_ext, exact to
# 0.3 px up to 60 frames ahead on a recorded run), and four inputs describe the nearest platform. Aim: Mario waits at the bridge until a
# jump would land on it ('land' flips from -1 to 1) and rides it. Measure: scripts/riding.py (steps standing on a platform).
# Run: smwai experiment --spec configs/experiments/predict_yi3.toml
name = "predict-yi3"
base = "configs/yi3.toml"
seeds = [4, 6, 7]
generations = 15
pop_size = 60
workers = 12

[[variant]]
name = "predict"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
predict_platforms = true
jump_fixes = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
