# Second Yoshi Island 3 test: the same two variants (upview, upview + platform prediction) on seeds 1 and 2, 120 generations each (about 65 minutes per run, 4 runs).
# Seed 4 of long-yi3: upview reached x 2799 in 250 generations, predict stuck at x 533. Run: scripts/long2_yi3.sh (log /tmp/long2_yi3.log)
name = "long2-yi3"
base = "configs/yi3.toml"
seeds = [1, 2]
generations = 120
pop_size = 80
workers = 12

[[variant]]
name = "upview"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "predict"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
predict_platforms = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
