# The reach map (a grid of the tiles some jump would land on) on Yoshi's Island 3: the upview setup plus reach_map, ten seeds, 20 generations, population 60.
# The baseline is the `base` variant of nodes_yi3 / nodes2_yi3 (same settings, same seeds 1-10): 3 of 10 seeds climbed (y < 100), median best x 547.
# About 5 minutes per run, 10 runs. Count climbs: scripts/seed_screen.py reach-yi3. Run: scripts/reach_yi3.sh (log /tmp/reach_yi3.log)
name = "reach-yi3"
base = "configs/yi3.toml"
seeds = [2, 4, 1, 3, 5, 6, 7, 8, 9, 10]
generations = 20
pop_size = 60
workers = 12

[[variant]]
name = "reach"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
reach_map = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
