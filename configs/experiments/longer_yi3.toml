# Longer test of the novelty and death-map ideas on Yoshi's Island 3: 30 generations, three seeds, baseline in the same spec.
# Run: smwai experiment --spec configs/experiments/longer_yi3.toml
name = "longer-yi3"
base = "configs/yi3.toml"
seeds = [4, 6, 7]
generations = 30
pop_size = 60
workers = 12

[[variant]]
name = "baseline"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0

[[variant]]
name = "novelty03"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
[variant.novelty]
enabled = true
weight = 0.3

[[variant]]
name = "deaths"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
death_inputs = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
min_improvement = 20.0
