# About one hour on Yoshi's Island 3: the upview setup (the one that reached x 2799 on seed 4 in 250 generations) on seeds 4 and 7, 80 generations each, population 80,
# adaptive mutation on (the stall boost: 3 stalled generations -> double weight mutation, more connections and nodes, until the best improves) plus the nuke after 12 stalled generations; see events.jsonl.
# Seed 4 took about 15 s per generation early and about 40 s later; seed 7 is expected to be faster. Run: scripts/hour_yi3.sh (log /tmp/hour_yi3.log)
name = "hour-yi3"
base = "configs/yi3.toml"
seeds = [4, 7]
generations = 80
pop_size = 80
workers = 12

[[variant]]
name = "upview"
[variant.env]
levels = ["YoshiIsland3"]
inputs = "ride"
window = [4, 9, 12, 3]
cancel_opposites = true
jump_fixes = true
[variant.reward]
height_bonus = 1.0
[variant.adapt]
enabled = true
stall_generations = 3
nuke_after = 12          # 12 stalled generations: rewrite 70% of the next generation (mutated best / mutated best of another species or a fresh genome / crossovers)
nuke_cooldown = 10
min_improvement = 20.0
